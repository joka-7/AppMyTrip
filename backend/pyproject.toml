[project]
name = "tripweaver-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "piper-tts>=1.2; python_version >= '3.10'",
    "sqlalchemy>=2.0",
    "bcrypt>=4.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: handled by ruff format. B008: FastAPI's Depends() pattern requires
# calling Depends() in argument defaults — that's how DI works in FastAPI.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
