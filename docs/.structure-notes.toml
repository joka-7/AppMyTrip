[notes]

"frontend" = "Vite + React + TypeScript + Tailwind web app — the 4-step build flow and live phone preview"
"frontend/src/App.tsx" = "4-step builder UI + live preview / shared-trip viewer"
"frontend/src/firebase.ts" = "Firebase init (Google sign-in + Firestore)"
"frontend/src/i18n" = "UI language store + he/en/fr dictionaries"
"frontend/src/hooks" = "Podcast player, install prompt, trip branding, checklist, editing"
"frontend/src/services" = "tripsStore, appDesign, tripFile, apiKey, and other pure/service logic"
"frontend/src/components" = "Builder steps (1-4), AppFrame, MapView, CloudMenu, and shared UI"
"frontend/firestore.rules" = "Firestore security rules (per-user + public shares)"
"frontend/e2e" = "Playwright end-to-end tests (real browser, AI provider mocked)"

"docs" = "Design documentation"
"docs/HLD.md" = "High-Level Design (architecture + flows)"
"docs/LLD.md" = "Low-Level Design (modules, classes, contracts)"
"docs/screenshots" = "Screenshots referenced from README.md"
".run" = "Shared PyCharm/WebStorm run configurations"

# Generated by `python .ai/bin/ai-sync` from ai-config.toml. Without these the
# tree derives each one's note from its first heading — all four say
# "AGENTS.md", which tells a reader nothing they can't see from the filename.
"AGENTS.md" = "The compiled coding rules every AI assistant reads — generated, do not hand-edit"
"CLAUDE.md" = "Claude Code's copy of AGENTS.md (generated)"
"GEMINI.md" = "Gemini CLI's copy of AGENTS.md (generated)"
".github/copilot-instructions.md" = "Copilot's copy of AGENTS.md (generated)"
"ai-config.toml" = "Which rule fragments and target tools ai-sync compiles for this repo"
"ai-config.local.md" = "Project-specific rules appended verbatim to the generated AGENTS.md"
".ai" = "ogen-ai submodule — the shared source of rules, skills and the ai-sync generator"
"frontend/android" = "Capacitor Android shell (generated by `npx cap add android`, plus MainActivity for Google sign-in)"
"frontend/capacitor.config.json" = "Capacitor app id, name and web build directory"
"frontend/android/app/src/main/java/io/github/joka7/appmytrip/MainActivity.java" = "Hands Google's Drive-consent result to the SocialLogin plugin"
