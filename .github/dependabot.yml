# Keep GitHub Dependabot PRs flowing for the two package ecosystems this
# repo actually uses. Group weekly so we don't get one PR per tiny bump.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Majors here mean React/Tailwind/Vite migrations, not routine upkeep. They
    # need a hand-driven upgrade branch, so keep them out of the weekly PR.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # The lint/type toolchain has to move together: typescript-eslint pins a
      # narrow peer range on typescript, and a lone typescript bump breaks
      # `npm install` outright. First matching group wins, so this stays above
      # the catch-all.
      frontend-toolchain:
        patterns:
          - "typescript"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "prettier"
        update-types:
          - minor
          - patch
      frontend-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      backend-deps:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # Ungrouped, this ecosystem opens one PR per action, so a quiet week still
    # costs three reviews for what is really a single upkeep change. The
    # workflows pin the same handful of actions, so move them together.
    groups:
      github-actions:
        patterns:
          - "*"
