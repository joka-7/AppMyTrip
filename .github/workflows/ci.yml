name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # backend/pyproject.toml declares requires-python >=3.11, so the floor
        # is part of the contract and gets tested alongside the 3.12 the rest
        # of the portfolio runs.
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Only backend/vendor/model-dispatcher is fetched, not every submodule.
      # `.ai` (ogen-ai) is also a submodule now, and it's a private repo the
      # default GITHUB_TOKEN cannot read — `submodules: true` would fail the
      # job trying. CI doesn't need `.ai` anyway: ai-sync runs in `copy` mode,
      # so AGENTS.md and the skill trees are real committed files.
      - name: Fetch the model-dispatcher submodule
        # This job defaults to `backend`; the submodule path is repo-relative.
        working-directory: ${{ github.workspace }}
        run: git submodule update --init --depth 1 backend/vendor/model-dispatcher
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      # Opt-in and kept out of requirements-dev.txt (see
      # requirements-model-dispatcher.txt for why) — installed as its own
      # step so test_llm_model_dispatcher.py is still exercised in CI.
      - run: pip install -r requirements-model-dispatcher.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      # Advisory for now: fails the step (and surfaces findings in the job log)
      # without failing the whole workflow until the known backlog is cleared.
      - name: pip-audit
        continue-on-error: true
        run: pip-audit -r requirements.txt

  backend-coverage:
    name: Backend coverage gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt pytest-cov
      - name: Run suite with coverage gate
        # Floor set just under the 84% measured when this gate was added, so a
        # marginal platform difference doesn't fail an unrelated PR. Ratchet it
        # up as gaps close — it is a floor, not a target. Measured separately
        # from the version matrix above: coverage is a property of the suite,
        # not of the interpreter.
        run: pytest --cov=. --cov-report=term-missing --cov-fail-under=82

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
      # Same as pip-audit: report known advisories without blocking merges on
      # the existing moderate/high backlog (tracked separately).
      - name: npm audit
        continue-on-error: true
        run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
