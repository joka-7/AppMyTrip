name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          # backend/vendor/model-dispatcher is a git submodule (see
          # backend/.gitmodules), needed to install and test the opt-in
          # LLM_BACKEND=model_dispatcher path below — a plain checkout
          # leaves it empty.
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      # Opt-in and kept out of requirements-dev.txt (see
      # requirements-model-dispatcher.txt for why) — installed as its own
      # step so test_llm_model_dispatcher.py is still exercised in CI.
      - run: pip install -r requirements-model-dispatcher.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      # Advisory for now: fails the step (and surfaces findings in the job log)
      # without failing the whole workflow until the known backlog is cleared.
      - name: pip-audit
        continue-on-error: true
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
      # Same as pip-audit: report known advisories without blocking merges on
      # the existing moderate/high backlog (tracked separately).
      - name: npm audit
        continue-on-error: true
        run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
